{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Government Services</h1>
        <p>Find the government service you need with PARTH.</p>
    </div>
</div>

<div class="services-grid">

    {% for service in services %}

    <div class="service-card">

        <div class="service-icon">
            {{ service.icon }}
        </div>

        <h3>{{ service.name }}</h3>

        <p>{{ service.description }}</p>

        <button
            type="button"
            class="primary-btn"
            onclick="showService(
                '{{ service.name | replace("'", "\\'") }}',
                '{{ service.description | replace("'", "\\'") }}',
                '{{ service.eligibility | replace("'", "\\'") }}',
                '{{ service.process | replace("'", "\\'") }}'
            )">
            View Guidance →
        </button>

    </div>

    {% endfor %}

</div>


<!-- Guidance Modal -->

<div id="serviceModal" class="modal">

    <div class="modal-content">

        <button
            type="button"
            class="modal-close"
            onclick="closeService()"
        >
            &times;
        </button>

        <h2 id="modalTitle"></h2>

        <p id="modalDescription"></p>

        <div class="guidance-section">

            <h3>Eligibility</h3>

            <p id="modalEligibility"></p>

        </div>

        <div class="guidance-section">

            <h3>Process</h3>

            <p id="modalProcess"></p>

        </div>

        <div class="modal-actions">

            <button
                type="button"
                class="primary-btn"
                onclick="saveApplication()">
                Save to My Applications
            </button>

        </div>

    </div>

</div>


<script>

let selectedService = "";


function showService(name, description, eligibility, process) {

    selectedService = name;

    document.getElementById("modalTitle").textContent = name;

    document.getElementById("modalDescription").textContent = description;

    document.getElementById("modalEligibility").textContent = eligibility;

    document.getElementById("modalProcess").textContent = process;

    document.getElementById("serviceModal").style.display = "flex";
}


function closeService() {

    document.getElementById("serviceModal").style.display = "none";

}


async function saveApplication() {

    if (!selectedService) {
        return;
    }

    try {

        const response = await fetch("/api/save-application", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                service: selectedService
            })

        });


        const data = await response.json();


        if (data.success) {

            alert("Service saved successfully!");

        } else {

            alert(data.message || "Unable to save service.");

        }

    } catch (error) {

        console.error(error);

        alert("Something went wrong. Please try again.");

    }

}


window.onclick = function(event) {

    const modal = document.getElementById("serviceModal");

    if (event.target === modal) {

        closeService();

    }

};

</script>

{% endblock %}
