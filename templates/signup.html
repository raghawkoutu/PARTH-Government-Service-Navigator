{% extends "base.html" %}

{% block title %}
Create Account · PARTH
{% endblock %}


{% block content %}

<section class="auth">

    <div class="auth-card">

        <div class="biglogo">
            ⌖
        </div>

        <h1>
            Create your PARTH account
        </h1>

        <p class="tagline">
            Let me help you find your way.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>
                Full Name
            </label>

            <input
                name="name"
                required
            >


            <label>
                Mobile Number
            </label>

            <input
                name="mobile"
                type="tel"
                required
            >


            <label>
                Email
                <small>(Optional)</small>
            </label>

            <input
                name="email"
                type="email"
            >


            <label>
                Create Password
            </label>

            <input
                name="password"
                type="password"
                required
            >


            <button type="submit">
                CREATE ACCOUNT
            </button>

        </form>


        <p>

            Already have an account?

            <a href="/">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
